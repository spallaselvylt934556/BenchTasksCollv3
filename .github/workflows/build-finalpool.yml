name: Build final pool
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble implemented tasks
        env:
          TASK_NAMES: |
            activity-logger
            alert-system
            analytics-dashboard
            asset-optimizer
            backup-utility
            blog-engine
            booking-system
            cache-optimizer
            calendar-sync
            canvas-automation
            canvas-grade-automation
            certificate-manager
            chat-bot
            client-portal
            cms-builder
            contact-manager
            content-manager
            content-scheduler
            coupon-manager
            crm-system
            customer-feedback-processor
            customer-portal
            data-analytics
            data-validator
            deal-manager
            deployment-tool
            discount-calculator
            email-campaign
            email-classification-system
            error-tracker
            expense-tracker
            feedback-collector
            file-manager
            follow-up-reminder
            form-builder
            health-monitor
            help-desk
            image-processor
            inventory-management
            invoice-generator
            load-balancer
            log-analyzer
            loyalty-program
            media-organizer
            monitoring-agent
            network-analyzer
            order-processor
            payment-processor
            pdf-report-generator
            permission-manager
            personalization-service
            price-tracker
            product-catalog
            qr-generator
            reminder-service
            robots-handler
            sales-pipeline
            scheduler
            search-engine
            security-scanner
            sentiment-analyzer
            shipment-tracker
            sitemap-generator
            social-connector
            social-publisher
            status-checker
            storage-manager
            streaming-service
            subtitle-generator
            survey-builder
            sync-service
            tag-manager
            task-scheduler
            template-engine
            territory-manager
            translation-api
            video-trimmer
            voice-processor
            web-crawler
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          python - <<'PY'
          import os, subprocess, pathlib
          names = sorted(set(os.environ["TASK_NAMES"].split()))
          def git(*args):
              return subprocess.check_output(["git", *args])
          refs = [r for r in git("for-each-ref", "--format=%(refname:short)", "refs/remotes/origin").decode().split() if r not in {"origin/main", "origin/finalpool"} and not r.endswith("/HEAD")]
          sources = {}
          for ref in refs:
              files = git("ls-tree", "-r", "--name-only", ref, "tasks").decode().splitlines()
              for path in files:
                  parts = path.split("/")
                  if len(parts) >= 4 and parts[0] == "tasks" and parts[1] != "examples" and "/".join(parts[2:]) == parts[2] + "/docs/task.md":
                      sources.setdefault(parts[2], []).append((ref, "/".join(parts[:3])))
          assert len(names) == 79, (len(names), names)
          destination = pathlib.Path("tasks/finalpool")
          destination.mkdir(parents=True, exist_ok=True)
          copied = 0
          for name in names:
              matches = sources.get(name, [])
              assert len(matches) == 1, (name, matches)
              ref, source = matches[0]
              files = git("ls-tree", "-r", "--name-only", ref, source).decode().splitlines()
              assert files, (name, source)
              for path in files:
                  rel = str(pathlib.Path(path).relative_to(source))
                  target = destination / name / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(git("show", f"{ref}:{path}"))
                  copied += 1
          assert len(list(destination.iterdir())) == len(names)
          print(f"Copied {copied} files for {len(names)} tasks")
          PY
          rm -rf .github/workflows
          git config user.name "Task Pool Builder"
          git config user.email "task-pool-builder@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add 79 implemented tasks to tasks/finalpool"
          git push origin HEAD:finalpool